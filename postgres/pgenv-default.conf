# pgenv defaults, copied to ~/.pgenv/config/default.conf by postgres/install.sh
# (only if missing). pgenv sources this before every build/initdb.
#
# Keg-only deps come from profiles/work/Brewfile. Paths use /opt/homebrew/opt,
# which survives Homebrew version bumps (unlike Cellar/icu4c@NN paths).

declare -a PGENV_MAKE_OPTIONS=("-j$(sysctl -n hw.ncpu)")
export PGENV_MAKE_OPTIONS

declare -a PGENV_CONFIGURE_OPTIONS=(
  "--with-uuid=e2fs"
  "--with-openssl"
  "--with-icu"
  "LDFLAGS=-L/opt/homebrew/opt/libxml2/lib -L/opt/homebrew/opt/openssl@3/lib"
  "CPPFLAGS=-I/opt/homebrew/opt/libxml2/include -I/opt/homebrew/opt/openssl@3/include"
  "PKG_CONFIG_PATH=/opt/homebrew/opt/icu4c/lib/pkgconfig"
)
export PGENV_CONFIGURE_OPTIONS

declare -a PGENV_INITDB_OPTIONS=("-U" "postgres" "--locale" "en_US.UTF-8" "--encoding" "UNICODE")
export PGENV_INITDB_OPTIONS
